services:
  - type: web
    name: simple-bank
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: BANK_HOST
        value: 0.0.0.0
      - key: BANK_DATA_FILE
        value: /var/data/bank.dat
      - key: BANK_SECURE_COOKIES
        value: "true"
    disk:
      name: bank-storage
      mountPath: /var/data
      sizeGB: 1
